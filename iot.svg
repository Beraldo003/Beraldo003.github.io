<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation : la caméra prend une image, envoyée par FTP au Raspberry Pi puis par MQTT au tableau de bord"><defs></defs><rect width="400" height="300" fill="#14233A"/><g stroke="#1C2E4A" stroke-width="1"><path d="M0 40H400" /><path d="M0 80H400" /><path d="M0 120H400" /><path d="M0 160H400" /><path d="M0 200H400" /><path d="M0 240H400" /><path d="M0 280H400" /><path d="M40 0V300" /><path d="M80 0V300" /><path d="M120 0V300" /><path d="M160 0V300" /><path d="M200 0V300" /><path d="M240 0V300" /><path d="M280 0V300" /><path d="M320 0V300" /><path d="M360 0V300" /></g><rect x="30" y="226" width="80" height="6" fill="#2A4266" stroke="#8FA3BD"/><path d="M50 226 L50 206 L90 206 L90 226 Z" fill="#8FA3BD"/><line x1="60" y1="140" x2="60" y2="226" stroke="#8FA3BD" stroke-width="2" stroke-dasharray="4 3" opacity=".5"/><rect x="38" y="96" width="50" height="30" rx="3" fill="#F5F7F9"/><rect x="50" y="126" width="22" height="10" fill="#8FA3BD"/><circle cx="61" cy="111" r="9" fill="none" stroke="#F2B705" stroke-width="2" opacity="0"><animate attributeName="r" values="9;9;40" keyTimes="0;.02;.25" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.02;.25;1" dur="3s" repeatCount="indefinite"/></circle><text x="63" y="84" font-family="Archivo,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#8FA3BD" text-anchor="middle">caméra industrielle</text><rect x="160" y="122" width="80" height="56" rx="4" fill="#1E6B4A" stroke="#5BE38A"/><circle cx="172" cy="129" r="1.6" fill="#F2B705"/><circle cx="179" cy="129" r="1.6" fill="#F2B705"/><circle cx="186" cy="129" r="1.6" fill="#F2B705"/><circle cx="193" cy="129" r="1.6" fill="#F2B705"/><circle cx="200" cy="129" r="1.6" fill="#F2B705"/><circle cx="207" cy="129" r="1.6" fill="#F2B705"/><circle cx="214" cy="129" r="1.6" fill="#F2B705"/><circle cx="221" cy="129" r="1.6